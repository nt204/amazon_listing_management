map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream amazon_listing_next {
    server 127.0.0.1:2411;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # MAX_REQUEST_BYTES defaults to 75 MB. Leave a small allowance for headers
    # and multipart boundaries while rejecting unexpectedly large requests.
    client_max_body_size 80m;
    client_body_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # AI and mockup routes return incremental progress. Buffering would hide
    # that progress until the operation completes.
    location ~ ^/api/(trello/(process-card|generate-mockups|mockup-jobs)|listings/(generate|batch)) {
        proxy_pass http://amazon_listing_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header X-Accel-Buffering no always;
    }

    location / {
        proxy_pass http://amazon_listing_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
