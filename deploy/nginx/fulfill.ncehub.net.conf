# fulfill.ncehub.net — trang xưởng (sup): CHỈ mở trang /sup, tài nguyên cần cho nó và webhook Trello.
# Hướng dẫn: docs/SUP_PORTAL_SETUP.md
#
# Đặt vào /etc/nginx/sites-available/fulfill.ncehub.net rồi ln -s sang sites-enabled.
# Cần snippet cloudflare-only
# (tạo bởi scripts/server/cloudflare-only.sh).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fulfill.ncehub.net;
    server_tokens off;

    # Chỉ nhận kết nối từ Cloudflare: email đăng nhập do Cloudflare Access gắn vào header,
    # gọi thẳng IP máy chủ thì không giả được header đó.
    include snippets/cloudflare-only.conf;

    # Dùng cùng chứng chỉ với ncehub.net (xem bước 3 trong hướng dẫn: sudo grep -n ssl_ /etc/nginx/sites-enabled/ncehub.net)
    ssl_certificate     /etc/ssl/CHANGE_ME/cert.pem;
    ssl_certificate_key /etc/ssl/CHANGE_ME/key.pem;

    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = / {
        return 302 /sup;
    }

    # Trang xưởng + API chỉ đọc của xưởng. Chỉ cho GET/HEAD.
    location ~ ^/(sup|api/sup/) {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:2411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Header thử nghiệm chỉ dùng ở máy local — xoá nếu ai đó gửi lên
        proxy_set_header X-Dev-Sup-Email "";
        proxy_read_timeout 60s;
    }

    # Webhook Trello (thẻ R&D → Bảng Mã) đã đăng ký với địa chỉ này — Trello gọi HEAD khi đăng ký, POST mỗi sự kiện.
    # Cloudflare Access phải Bypass đúng đường dẫn này (xem hướng dẫn).
    location = /api/trello/webhook {
        limit_except GET HEAD POST { deny all; }
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:2411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # JS / CSS / font của Next.js (không chứa dữ liệu)
    location ^~ /_next/static/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:2411;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # favicon / icon của trang (Next.js app icon)
    location ~ ^/(favicon\.ico|icon[^/]*\.(png|svg|ico)|apple-icon[^/]*\.png)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:2411;
        proxy_set_header Host $host;
    }

    # Mọi đường dẫn khác (trang nội bộ, /api/accounting, /api/fulfill, ...) không tồn tại trên tên miền này
    location / {
        return 404;
    }
}
