services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Tinh chỉnh cho VPS 8 GB RAM (2026-11-15). shared_buffers giữ 512 MB vì next-server + ppc-ingestion-worker
    # từng bị OOM-kill (~4 GB mỗi tiến trình). Trên server đang chạy qua /root/amazon-listing-db-tuning.yaml.
    shm_size: 512mb
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=500
    environment:
      POSTGRES_DB: listing_desk
      POSTGRES_USER: listing_desk
      POSTGRES_PASSWORD: listing_desk
    ports:
      - "2412:5432"
    volumes:
      - listing_desk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listing_desk -d listing_desk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "2413:6379"
    volumes:
      - listing_desk_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  listing_desk_postgres:
  listing_desk_redis:
